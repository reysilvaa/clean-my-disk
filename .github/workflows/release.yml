name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binary
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-s -w -X clean-my-disk/internal/model.Version=${VER}" \
            -o "clean-my-disk-v${VER}.exe" .
          echo "ARTIFACT=clean-my-disk-v${VER}.exe" >> "$GITHUB_ENV"

      - name: Verify version baked in
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          out="$(./clean-my-disk-v${VER}.exe --version)"
          echo "$out"
          [[ "$out" == *"v${VER}"* ]] || { echo "version mismatch"; exit 1; }

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: clean-my-disk
          path: clean-my-disk-*.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: clean-my-disk-*.exe
          generate_release_notes: true
